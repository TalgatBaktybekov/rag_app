version: '3.8'

services:
  db:
    image: postgres:14
    container_name: rag_app_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_app}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-rag_app}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - NODE_ENV=production
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - embeddings_data:/app/embeddings
      - user_data:/app/data
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag_network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: rag-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - VITE_API_URL=${BACKEND_URL:-http://localhost:8000}
    networks:
      - rag_network

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - rag_network

volumes:
  pg_data_prod:
  embeddings_data:
  user_data:
  logs_data:

networks:
  rag_network:
    driver: bridge
